services:
  - type: web
    name: qrguard-api-osswt
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: QRGUARD_CORS_ORIGINS
        value: https://qrguard-app-osswt.onrender.com
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"

  - type: web
    name: qrguard-app-osswt
    runtime: static
    buildCommand: echo "Publishing the verified local Flutter build"
    staticPublishPath: ./deploy/render/web/public
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
